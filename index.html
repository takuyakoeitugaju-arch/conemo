<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<title>CONEMO 測定</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Yu Gothic UI','Yu Gothic',sans-serif;margin:0;background:#F4F9FD;color:#1A3A5C}
.box{max-width:520px;margin:18vh auto 0;padding:24px;text-align:center;line-height:1.8;font-size:15px}
.spin{width:36px;height:36px;margin:0 auto 14px;border:4px solid #E0EEF7;border-top-color:#3E98BB;border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.btn{display:inline-block;margin-top:12px;background:#3E98BB;color:#fff;border:0;padding:11px 20px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
small{color:#5B8DB8}
</style>
</head>
<body>
<div class="box" id="box"><div class="spin"></div><p>読み込んでいます…</p></div>
<script>
// CONEMO コーチ用ページの入口。
// 中身は Apps Script（コネモ測定表）から、Google のログイン情報を付けずに取ってきて表示する。
// こうすると、ブラウザが Google の複数アカウントや職場のアカウントにログインしていても開ける。
// 速く見せるため、このスマホで前に開いた同じ画面をすぐ出し、裏で最新を取って、まだ触っていなければ差し替える。
// 電波がないときは前の画面のまま（入力した数字はスマホに残り、電波が戻ると送られる）。トップでは今日の8種目を裏で先に読んでおく。
(function () {
  var API = 'https://script.google.com/macros/s/AKfycbwjXLO7kiKY4qahW8ZPmulBs_YhWXrSKz9iu84WtvSDunQ5coh4D_rGa-LsrLsyMoAZzg/exec';
  var box = document.getElementById('box');
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }
  function fail(msg) { box.innerHTML = '<p>' + msg + '</p><button class="btn" onclick="location.reload()">もう一度読み込む</button>'; }

  // 電波がなくてもこのページ自体を開けるように（測定のデータはここには保存しない）
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js').catch(function () {}); } catch (e) { /* 使えないブラウザ */ } }

  // ?key= で開かれたら # の後ろに移す（合言葉をサーバーに送らない）
  if (/[?&]key=/.test(location.search)) history.replaceState(null, '', location.pathname + '#' + location.search.slice(1));
  var q = new URLSearchParams(location.hash.slice(1));
  if (!q.get('key')) { box.innerHTML = '<p>コーチ用のリンクから開いてください。</p>'; return; }

  var params = new URLSearchParams({ api: '1', front: location.origin + location.pathname });
  var names = ['key', 'date', 'view', 'name', 'sport'];
  names.forEach(function (k) { if (q.get(k)) params.set(k, q.get(k)); });

  // 前に開いた画面の控え（画面ごとに1つ、新しい順に12画面まで）
  var CK = 'conemo:page:' + names.map(function (k) { return q.get(k) || ''; }).join('|');
  function cacheGet() { try { return JSON.parse(localStorage.getItem(CK) || 'null'); } catch (e) { return null; } }
  function cachePut(d) {
    try {
      var list = JSON.parse(localStorage.getItem('conemo:pages') || '[]').filter(function (k) { return k !== CK; });
      list.unshift(CK);
      list.slice(24).forEach(function (k) { localStorage.removeItem(k); }); // 新しい順に24画面まで
      localStorage.setItem('conemo:pages', JSON.stringify(list.slice(0, 24)));
      localStorage.setItem(CK, JSON.stringify({ at: Date.now(), d: d }));
    } catch (e) { /* 容量が足りないときは控えなしで続ける */ }
  }

  function render(d, note) {
    var head = '<script>(' + shim.toString() + ')(' + JSON.stringify(API) + ');<\/script>' +
      (d.mobile ? '<meta name="viewport" content="width=device-width, initial-scale=1">' : '');
    var html = /<head[^>]*>/i.test(d.html) ? d.html.replace(/<head[^>]*>/i, function (m) { return m + head; }) : head + d.html;
    if (note) {
      var bar = '<div style="background:#FFF4D6;color:#8A5F00;font:700 13px/1.6 sans-serif;padding:8px 14px">' + note + '</div>';
      html = /<body[^>]*>/i.test(html) ? html.replace(/<body[^>]*>/i, function (m) { return m + bar; }) : bar + html;
    }
    document.open();
    document.write(html);
    document.close();
    document.title = d.title;
  }

  function note(msg) { // 書き出したあとのページの一番上に、ひとこと出す
    var bar = document.createElement('div');
    bar.style.cssText = 'background:#FFF4D6;color:#8A5F00;font:700 13px/1.6 sans-serif;padding:8px 14px';
    bar.textContent = msg;
    if (document.body) document.body.insertBefore(bar, document.body.firstChild);
  }
  function ago(at) { var t = new Date(at); return (t.getMonth() + 1) + '/' + t.getDate() + ' ' + t.getHours() + ':' + ('0' + t.getMinutes()).slice(-2); }

  var view = q.get('view') || '', isTop = !q.get('date') && !view;
  var cached = view === 'print' ? null : cacheGet(); // 印刷用は毎回最新を取る
  var FRESH = 12 * 3600e3;                           // すぐ出すのは12時間以内に開いた画面だけ（電波がないときは7日前まで）
  var shown = false, touched = false;
  function watch() { // 画面を触ったら、最新が届いても差し替えない（入力中の画面が入れ替わらないように）
    touched = false;
    ['touchstart', 'mousedown', 'keydown', 'input', 'wheel'].forEach(function (ev) { window.addEventListener(ev, function () { touched = true; }, { capture: true, passive: true }); });
  }
  // 前の画面は、このページの読み込みが終わってから出す（読み込み中に書き出すと、置き換えではなく書き足しになる）
  function showCached() { if (shown || !cached || !cached.d || Date.now() - cached.at > FRESH) return; render(cached.d); shown = true; watch(); if (isTop) prefetch(); }
  if (cached && cached.d) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', showCached); else setTimeout(showCached, 0); }

  fetch(API + '?' + params.toString(), { credentials: 'omit', cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      if (!d.ok) { // 合言葉を作り直したあとの古いリンクなど：前の画面は出さず、この合言葉の控えを全部消す
        try {
          var pre = 'conemo:page:' + q.get('key') + '|';
          for (var i = localStorage.length - 1; i >= 0; i--) { var k = localStorage.key(i); if (k && k.indexOf(pre) === 0) localStorage.removeItem(k); }
        } catch (e) { /* 無視 */ }
        if (shown) { document.open(); document.write('<!DOCTYPE html><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><p style="font:15px/1.8 sans-serif;padding:24px">' + esc(d.error) + '</p>'); document.close(); }
        else box.innerHTML = '<p>' + esc(d.error) + '</p>';
        return;
      }
      if (view !== 'print') cachePut(d);
      if (!shown || !touched) { render(d); shown = true; watch(); }
      if (isTop) prefetch();
    })
    .catch(function (e) {
      if (shown) { note('電波がないため、' + ago(cached.at) + ' に開いたときの画面です。入れた数字はスマホに残り、電波が戻ると自動で送られます。'); return; }
      if (cached && cached.d && Date.now() - cached.at < 7 * 864e5) { // 12時間より前の控えでも、電波がないときは出す
        render(cached.d, '電波がないため、' + ago(cached.at) + ' に開いたときの画面です。入れた数字はスマホに残り、電波が戻ると自動で送られます。');
        return;
      }
      fail('読み込めませんでした。電波を確認して、もう一度お試しください。<br><small>' + esc(e.message) + '</small>');
    });

  // トップを開いたら、今日の8種目の記録表を裏で読んで控えておく（押した瞬間に出るように。10分に1回まで）
  function prefetch() {
    try {
      if (prefetch.done || navigator.onLine === false) return;
      prefetch.done = true;
      var t = new Date(Date.now() + 9 * 3600e3).toISOString(), day = t.slice(2, 4) + '.' + t.slice(5, 7) + '.' + t.slice(8, 10);
      var last = +localStorage.getItem('conemo:pre:' + day) || 0;
      if (Date.now() - last < 600e3) return;
      localStorage.setItem('conemo:pre:' + day, String(Date.now()));
      var sports = ['幅跳び', '認知判断', '片足バランス', '眼と手', '眼球運動', '空間認識', '周辺視野', '瞬間視記憶'];
      (function next() {
        var s = sports.shift(); if (!s) return;
        var p = new URLSearchParams({ api: '1', front: location.origin + location.pathname, key: q.get('key'), date: day, view: 'entry', sport: s });
        fetch(API + '?' + p.toString(), { credentials: 'omit', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
          if (d && d.ok) {
            var k = 'conemo:page:' + [q.get('key'), day, 'entry', '', s].join('|'), list = JSON.parse(localStorage.getItem('conemo:pages') || '[]').filter(function (x) { return x !== k; });
            list.push(k); // 先読みは古い方の端に置く（いっぱいなら、実際に開いた画面ではなく先読みの方をあきらめる）
            var drop = list.splice(24);
            drop.forEach(function (x) { localStorage.removeItem(x); });
            localStorage.setItem('conemo:pages', JSON.stringify(list));
            if (drop.indexOf(k) < 0) localStorage.setItem(k, JSON.stringify({ at: Date.now(), d: d }));
          }
          next();
        }).catch(function () { /* 先読みは失敗しても困らない */ });
      })();
    } catch (e) { /* 先読みは失敗しても困らない */ }
  }

  // 書き出したページの中で動く部品：google.script.run の代わり（記録の保存・コメント保存・名前の追加）と、ページ内の移動
  function shim(API) {
    function runner(ok, ng) {
      return new Proxy({}, { get: function (_, fn) {
        if (fn === 'withSuccessHandler') return function (f) { return runner(f, ng); };
        if (fn === 'withFailureHandler') return function (f) { return runner(ok, f); };
        return function () {
          var args = Array.prototype.slice.call(arguments);
          fetch(API, { method: 'POST', credentials: 'omit', body: JSON.stringify({ fn: fn, args: args }) })
            .then(function (r) { return r.json(); })
            .then(function (d) { if (d.ok) { if (ok) ok(d.result); } else if (ng) ng(new Error(d.error)); })
            .catch(function () { if (ng) ng(new Error('通信できませんでした。電波を確認してもう一度押してください')); });
        };
      } });
    }
    window.google = { script: { run: runner(null, null) } };
    window.addEventListener('hashchange', function () { location.reload(); });
  }
})();
</script>
</body>
</html>
